name: DTEK attention popup

# Кожні 10 хв (GitHub може запізнюватись на 5–15 хв). Ручний запуск — вкладка Actions.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attention
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Scrape popup + address → Worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ATTENTION_TOKEN: ${{ secrets.ATTENTION_TOKEN }}
          ADDRESS_CITY: ${{ secrets.ADDRESS_CITY }}
          ADDRESS_STREET: ${{ secrets.ADDRESS_STREET }}
          ADDRESS_HOUSE: ${{ secrets.ADDRESS_HOUSE }}
        run: node scrape.mjs
